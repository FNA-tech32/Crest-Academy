<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 50" width="250" height="50">
  <defs>
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#E5A800"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Crest Shield Icon -->
  <g transform="translate(6, 4)" filter="url(#shadow)">
    <!-- Shield Background -->
    <path d="M20 2 C28 2 37 6 37 6 C37 22 28 34 20 40 C12 34 3 22 3 6 C3 6 12 2 20 2 Z" 
          fill="#8B1115" stroke="url(#crestGold)" stroke-width="2.5" />
    
    <!-- Open Book / Wings Symbol -->
    <path d="M12 24 C16 21 19 22 20 24 C21 22 24 21 28 24 C28 27 24 29 20 26 C16 29 12 27 12 24 Z" 
          fill="url(#crestGold)" />
    
    <!-- Academic Star / Crest Peak -->
    <polygon points="20,10 22.2,14.5 27,15.2 23.5,18.6 24.3,23.4 20,21.1 15.7,23.4 16.5,18.6 13,15.2 17.8,14.5" 
             fill="url(#crestGold)" />
  </g>

  <!-- Typography -->
  <!-- "CREST" -->
  <text x="52" y="27" 
        font-family="'Nunito', 'Segoe UI', Arial, sans-serif" 
        font-size="23" 
        font-weight="900" 
        letter-spacing="2" 
        fill="#FFFFFF">CREST</text>
  
  <!-- "ACADEMY" -->
  <text x="53" y="42" 
        font-family="'Nunito', 'Segoe UI', Arial, sans-serif" 
        font-size="11" 
        font-weight="700" 
        letter-spacing="4.5" 
        fill="#FFD700">ACADEMY</text>
</svg>

